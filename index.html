<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>כלים</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg: #0f1216; --card: #171b22; --card-h: #1e232c;
      --text: #e8eaed; --muted: #9aa4b2; --accent: #4f8cff; --border: #2a303a;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f4f6f9; --card:#fff; --card-h:#eef1f6; --text:#1a1d22; --muted:#5b6472; --border:#e2e6ec; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, "Segoe UI", "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif; line-height: 1.6;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 48px 16px 60px; }
    h1 { font-size: 2rem; margin: 0 0 6px; }
    .sub { color: var(--muted); margin: 0 0 32px; }
    .grid { display: grid; gap: 14px; }
    a.tool {
      display: block; text-decoration: none; color: inherit;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 20px; transition: background .15s, transform .15s;
    }
    a.tool:hover { background: var(--card-h); transform: translateY(-2px); }
    .tool h2 { margin: 0 0 4px; font-size: 1.15rem; }
    .tool p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .tool .arrow { float: left; color: var(--accent); font-size: 1.2rem; }
    footer { margin-top: 40px; color: var(--muted); font-size: 0.82rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>כלים</h1>
    <p class="sub">אוסף קטן של כלים המופעלים ישירות בדפדפן. בלי התקנה, בלי שרת.</p>

    <div class="grid">
      <a class="tool" href="tools/mishkan-shilo-text-extractor/">
        <span class="arrow">‹</span>
        <h2>משכן שילה — מחלץ טקסט</h2>
        <p>בוחרים גיליון וטווח עמודים ומקבלים טקסט עברי נקי ומוכן להעתקה (מתקן את הבעיה של העתקה פגומה מקובצי ה־PDF).</p>
      </a>
    </div>

    <footer>מתארח ב־GitHub Pages · פועל כולו בצד הלקוח</footer>
  </main>
</body>
</html>

name: Refresh magazine list

# Re-scrapes the Mishkan Shilo site and commits magazines.json if it changed.
# Runs weekly, and can be triggered manually from the Actions tab
# (Actions → "Refresh magazine list" → "Run workflow").
on:
  schedule:
    - cron: "17 6 * * 0" # Sundays ~06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape magazine list
        run: python3 scripts/scrape_magazines.py
      - name: Commit if changed
        run: |
          FILE=tools/mishkan-shilo-text-extractor/magazines.json
          if git diff --quiet -- "$FILE"; then
            echo "No changes to $FILE."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "chore: refresh magazine list"
            git push
          fi
